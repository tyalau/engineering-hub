dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - '**/package.json'
      - 'pnpm-lock.yaml'

"scope:configs":
  - changed-files:
    - any-glob-to-any-file: 'packages/*-config/**'

"scope:starter":
  - changed-files:
    - any-glob-to-any-file: 'apps/**'

"scope:ui":
  - changed-files:
    - any-glob-to-any-file: 'packages/ui/**'

"scope:workflows":
  - head-branch: '^ci/'
  - changed-files:
    - any-glob-to-any-file: '.github/**'

"type:bug":
  - head-branch: '^fix/'

"type:docs":
  - head-branch: '^docs/'
  - changed-files:
    - any-glob-to-any-file: '**/*.md'

"type:engineering":
  - head-branch: '^chore/'
  - changed-files:
    - any-glob-to-any-file:
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

"type:feature":
  - head-branch: '^feat/'

"type:refactor":
  - head-branch: '^refactor/'

"type:dx":
  - changed-files:
    - any-glob-to-any-file:
      - 'CLAUDE.md'
      - '.storybook/**'
